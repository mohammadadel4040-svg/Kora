apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: property-service
  template:
    metadata:
      labels:
        app: property-service
    spec:
      containers:
        - name: property-service
          image: kora-property-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - name: PORT
              value: "5002"

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: kora-secrets
                  key: MONGO_URI

---
apiVersion: v1
kind: Service
metadata:
  name: property-service
spec:
  selector:
    app: property-service
  ports:
    - protocol: TCP
      port: 5002
      targetPort: 5002
  type: ClusterIP